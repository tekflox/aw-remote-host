name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to next vX.Y.Z patch)"
        required: false
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "install.sh"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            version="${INPUT_TAG}"
          else
            git fetch --tags --force
            latest="$(
              git tag -l 'v[0-9]*.[0-9]*.[0-9]*' |
                sort -V |
                tail -n 1
            )"
            if [ -z "${latest}" ]; then
              version="v0.1.0"
            else
              raw="${latest#v}"
              IFS=. read -r major minor patch <<< "${raw}"
              patch=$((patch + 1))
              version="v${major}.${minor}.${patch}"
            fi
          fi
          if git rev-parse "${version}" >/dev/null 2>&1; then
            echo "::error::resolved version ${version} already exists"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build linux + darwin + windows (amd64 & arm64 each)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            # Windows ships a .exe in a .zip: PowerShell's Expand-Archive
            # reads zip natively, while tar.gz needs a third-party tool on
            # anything older than Windows 10 1803. install.ps1 depends on
            # this naming.
            if [ "$os" = "windows" ]; then
              GOOS=$os GOARCH=$arch go build \
                -ldflags "-X main.version=${VERSION}" \
                -o "dist/aw-remote-host.exe" \
                ./cmd/aw-remote-host
              (cd dist && zip -q "aw-remote-host_${VERSION}_${os}_${arch}.zip" aw-remote-host.exe)
              rm dist/aw-remote-host.exe
            else
              GOOS=$os GOARCH=$arch go build \
                -ldflags "-X main.version=${VERSION}" \
                -o "dist/aw-remote-host" \
                ./cmd/aw-remote-host
              tar -czf "dist/aw-remote-host_${VERSION}_${os}_${arch}.tar.gz" -C dist aw-remote-host
              rm dist/aw-remote-host
            fi
          done

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Notify aw-backend release registry
        env:
          RELEASE_TOKEN: ${{ secrets.AW_RELEASE_WEBHOOK_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::warning::AW_RELEASE_WEBHOOK_TOKEN is not set; skipping release publish"
            exit 0
          fi

          python3 - <<'PY' > /tmp/aw-remote-host-release.json
          import json
          import os

          payload = {
              "component": "aw-remote-host",
              "version": os.environ["VERSION"],
              "sha": os.environ["SHA"],
              "url": os.environ["RELEASE_URL"],
              "metadata": {
                  "workflow": "release",
                  "run_id": os.environ["RUN_ID"],
              },
          }
          print(json.dumps(payload))
          PY

          curl -fsS -X POST "https://api.aw.tekflox.com/api/releases/publish" \
            -H "Content-Type: application/json" \
            -H "X-Release-Token: ${RELEASE_TOKEN}" \
            --data-binary @/tmp/aw-remote-host-release.json
