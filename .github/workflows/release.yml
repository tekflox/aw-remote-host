name: Release

# NOTE: auto tag-push trigger disabled on 2026-07-26 to save GitHub Actions
# minutes while the Remote Host is still being certified. Release manually
# via workflow_dispatch (pass the existing tag). Re-enable the tags push
# trigger once things are stable.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.1.0)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Resolve version
        id: version
        run: echo "version=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build linux/amd64 + linux/arm64 + darwin/amd64 + darwin/arm64
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            GOOS=$os GOARCH=$arch go build \
              -ldflags "-X main.version=${VERSION}" \
              -o "dist/aw-remote-host" \
              ./cmd/aw-remote-host
            tar -czf "dist/aw-remote-host_${VERSION}_${os}_${arch}.tar.gz" -C dist aw-remote-host
            rm dist/aw-remote-host
          done

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${VERSION}" dist/*.tar.gz dist/checksums.txt \
            --title "${VERSION}" \
            --generate-notes \
            --repo "${{ github.repository }}"
