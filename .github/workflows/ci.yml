name: CI

# Auto-triggers on push re-enabled 2026-08-03 per standing instruction: every
# aw-* repo runs its unit tests on every push. Runs on a self-hosted runner
# (aw-baremetal), so this doesn't consume billed GitHub Actions minutes —
# the 2026-07-26 concern doesn't apply here.
on:
  push:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: [self-hosted, aw-baremetal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The bootstrap modules are shell, so their own regressions are invisible
      # to `go test`. publish.sh in particular guards the case that made
      # aw-remote-host uninstallable on any host already using 5432/6379.
      - name: bootstrap shell unit tests
        run: |
          bash tests/bootstrap/publish_test.sh
          bash tests/bootstrap/network_test.sh
          bash tests/bootstrap/container_test.sh
          bash tests/bootstrap/podman_storage_test.sh
      - name: shellcheck bootstrap scripts
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::warning::shellcheck is not installed on this self-hosted runner; skipping shell lint"
            exit 0
          fi
          shellcheck install.sh bootstrap/*/*.sh
