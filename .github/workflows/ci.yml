name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: shellcheck bootstrap scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install.sh bootstrap/*/*.sh
