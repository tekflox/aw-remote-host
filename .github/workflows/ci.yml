name: CI

# NOTE: auto-triggers (push/pull_request) disabled on 2026-07-26 to save
# GitHub Actions minutes while the Remote Host is still being certified.
# Run manually from the Actions tab (workflow_dispatch). Re-enable the
# push/pull_request block once the build is proven stable.
on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: [self-hosted, aw-baremetal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: shellcheck bootstrap scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install.sh bootstrap/*/*.sh
